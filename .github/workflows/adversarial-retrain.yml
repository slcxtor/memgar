name: Adversarial Red-Team Loop

# Runs:
#  - Weekly on main: generate adversarial variants and test them against
#    the live Analyzer (the actual shipped detection surface)
#  - Manual trigger: for on-demand red-team runs
#
# What it does:
#  1. Sample N seed attacks from training_data.json
#  2. Generate adversarial variants (offline template mutations)
#  3. Curate variants (TF-IDF dedup, cluster-cap)
#  4. Test every variant against the live Analyzer
#  5. Report missed variants (false negatives) and append to review queue

on:
  schedule:
    - cron: "0 2 * * 0"

  workflow_dispatch:
    inputs:
      n_seeds:
        description: "Number of seed attacks to sample"
        default: "40"
        required: false
      n_variants:
        description: "Variants per seed"
        default: "6"
        required: false
      dry_run:
        description: "Dry run (report only, do not write review queue)"
        default: "false"
        type: boolean
        required: false

jobs:
  adversarial-redteam:
    name: Red-team loop (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,adversarial]"

      - name: Run continuous red-team loop
        run: |
          N_SEEDS="${{ github.event.inputs.n_seeds || '40' }}"
          N_VARIANTS="${{ github.event.inputs.n_variants || '6' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          FLAGS="--n-seeds ${N_SEEDS} --n-variants ${N_VARIANTS}"
          if [ "${DRY_RUN}" = "true" ]; then FLAGS="${FLAGS} --dry-run"; fi

          python scripts/continuous_redteam.py ${FLAGS} \
            | tee redteam_report.json

      - name: Run full test suite
        run: pytest -q

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report-${{ github.run_id }}
          path: redteam_report.json
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Adversarial Red-Team Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f redteam_report.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            head -50 redteam_report.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
