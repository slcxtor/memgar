name: Agent Framework Benchmark

on:
  push:
    branches:
      - main
    paths:
      - "memgar/integrations/**"
      - "memgar/secure_memory_store.py"
      - "memgar/runtime.py"
      - "scripts/agent_framework_benchmark.py"
      - ".github/workflows/agent-framework-benchmark.yml"
  pull_request:
    paths:
      - "memgar/integrations/**"
      - "memgar/secure_memory_store.py"
      - "memgar/runtime.py"
      - "scripts/agent_framework_benchmark.py"
      - ".github/workflows/agent-framework-benchmark.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  adapter-boundary-benchmark:
    name: Adapter boundary poisoning benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Memgar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run framework boundary benchmark
        run: |
          python scripts/agent_framework_benchmark.py \
            --json-out artifacts/agent-framework-benchmark-report.json \
            --min-tpr 0.99 \
            --max-fpr 0.01 \
            --max-p95-ms 50

      - name: Upload benchmark report
        if: always() && hashFiles('artifacts/agent-framework-benchmark-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-framework-benchmark
          path: artifacts/agent-framework-benchmark-report.json

  real-framework-benchmark:
    name: Real framework poisoning benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install real framework dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[langchain,crewai]" openai-agents

      - name: Run real framework benchmark
        run: |
          python scripts/agent_framework_benchmark.py \
            --require-real-frameworks \
            --json-out artifacts/agent-framework-benchmark-real-report.json \
            --min-tpr 0.99 \
            --max-fpr 0.01 \
            --max-p95-ms 250

      - name: Upload real framework benchmark report
        if: always() && hashFiles('artifacts/agent-framework-benchmark-real-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-framework-benchmark-real
          path: artifacts/agent-framework-benchmark-real-report.json
