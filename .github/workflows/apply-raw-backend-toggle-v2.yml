name: Apply raw backend toggle v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-raw-backend-toggle-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
