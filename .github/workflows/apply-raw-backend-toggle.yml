name: Apply raw backend toggle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-raw-backend-toggle.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply raw backend toggle patch
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding="utf-8")

          def replace(path: str, old: str, new: str) -> None:
              text = read(path)
              if old in text:
                  write(path, text.replace(old, new, 1))
              elif new not in text:
                  raise RuntimeError(f"expected text not found in {path}")

          replace(
              "memgar/secure_memory_store.py",
              "    allow_raw_backend_access: bool = False\n",
              "    allow_raw_backend_access: bool = False\n    strict: bool = False\n",
          )
          replace(
              "memgar/secure_memory_store.py",
              "        policy: Optional[SecureMemoryStorePolicy] = None,\n        agent_id: str = \"default\",\n    ) -> None:\n        self._backend = backend\n        self.policy = policy or SecureMemoryStorePolicy()\n",
              "        policy: Optional[SecureMemoryStorePolicy] = None,\n        allow_raw_backend_access: Optional[bool] = None,\n        agent_id: str = \"default\",\n    ) -> None:\n        self._backend = backend\n        self.policy = policy or SecureMemoryStorePolicy()\n        if allow_raw_backend_access is not None:\n            self.policy.allow_raw_backend_access = allow_raw_backend_access\n        if self.policy.strict and self.policy.allow_raw_backend_access:\n            raise ValueError(\n                \"SecureMemoryStorePolicy(strict=True) forbids raw backend access. \"\n                \"Disable strict mode or keep allow_raw_backend_access=False.\"\n            )\n",
          )
          replace(
              "memgar/secure_memory_store.py",
              "            principal=principal,\n            warning=\"raw backend access bypasses Memgar controls\",\n        )\n",
              "            principal=principal,\n            severity=\"warning\" if allowed else \"error\",\n            risk=\"memgar_bypass_possible\",\n            warning=\"raw backend access bypasses Memgar controls\",\n        )\n",
          )

          replace(
              "memgar/integrations/universal.py",
              "        auditor: Optional[Any] = None,\n        agent_id: str = \"default\",\n        allow_legacy_guard: bool = False,\n",
              "        auditor: Optional[Any] = None,\n        agent_id: str = \"default\",\n        allow_raw_backend_access: Optional[bool] = None,\n        allow_legacy_guard: bool = False,\n",
          )
          replace(
              "memgar/integrations/universal.py",
              "            and auditor is None\n        )\n",
              "            and auditor is None\n            and allow_raw_backend_access is None\n        )\n",
          )
          replace(
              "memgar/integrations/universal.py",
              "            auditor=auditor,\n            policy=store_policy,\n            agent_id=agent_id,\n        )\n",
              "            auditor=auditor,\n            policy=store_policy,\n            allow_raw_backend_access=allow_raw_backend_access,\n            agent_id=agent_id,\n        )\n",
          )

          replace(
              "tests/test_secure_memory_store.py",
              """    assert event[\"event\"] == \"raw_backend_access\"
    assert event[\"action\"] == \"allow\"
    assert event[\"principal\"] == \"admin\"


def test_unscanned_reads_are_blocked_by_default():
""",
              """    assert event[\"event\"] == \"raw_backend_access\"
    assert event[\"action\"] == \"allow\"
    assert event[\"principal\"] == \"admin\"
    assert event[\"severity\"] == \"warning\"
    assert event[\"risk\"] == \"memgar_bypass_possible\"


def test_raw_backend_escape_hatch_can_be_enabled_directly():
    backend = []
    store = SecureMemoryStore(
        backend=backend,
        analyzer=_Analyzer(),
        allow_raw_backend_access=True,
    )

    assert store.unsafe_backend(reason=\"controlled migration\", principal=\"admin\") is backend
    assert store.audit_events[-1][\"action\"] == \"allow\"


def test_raw_backend_escape_hatch_is_forbidden_in_strict_mode():
    with pytest.raises(ValueError, match=\"strict\"):
        SecureMemoryStore(
            backend=[],
            analyzer=_Analyzer(),
            policy=SecureMemoryStorePolicy(strict=True),
            allow_raw_backend_access=True,
        )


def test_unscanned_reads_are_blocked_by_default():
""",
          )

          replace(
              "tests/test_universal_agent_memory_adapter.py",
              """def test_default_secure_store_redacts_dlp_before_writer():\n""",
              """def test_universal_adapter_forwards_raw_backend_escape_hatch():\n    backend = []\n    guard = UniversalMemoryGuard(\n        backend=backend,\n        analyzer=AllowAnalyzer(),\n        allow_raw_backend_access=True,\n    )\n\n    assert guard.secure_store.unsafe_backend(reason=\"controlled migration\") is backend\n    assert guard.secure_store.audit_events[-1][\"action\"] == \"allow\"\n\n\ndef test_default_secure_store_redacts_dlp_before_writer():\n""",
          )

          replace(
              "README.md",
              """if result.allowed:\n    print(\"Memory stored through Memgar\", result.entry_id)\n```\n\nThe same wrapper can protect""",
              """if result.allowed:\n    print(\"Memory stored through Memgar\", result.entry_id)\n```\n\nRaw backend access is disabled by default. Advanced users can enable an audited\nescape hatch for controlled migrations or diagnostics:\n\n```python\nmemory = SecureMemoryStore(\n    backend=raw_store,\n    vault=vault,\n    allow_raw_backend_access=True,  # unsafe escape hatch\n)\n\nbackend = memory.unsafe_backend(\n    reason=\"one-time migration\",\n    principal=\"admin@example.com\",\n)\n```\n\nEvery `unsafe_backend()` call records a warning audit event. In strict\nproduction policy, keep `allow_raw_backend_access=False`.\n\nThe same wrapper can protect""",
          )

          replace(
              "docs/quickstart.md",
              """    Use this path when an agent writes long-term memory. Direct backend writes\n    bypass Memgar, so keep the raw backend private.\n""",
              """    Use this path when an agent writes long-term memory. Direct backend writes\n    bypass Memgar, so keep the raw backend private. Raw backend access is\n    disabled by default; enable it only as an audited `unsafe_backend()` escape\n    hatch for controlled migrations or diagnostics.\n""",
          )
          replace(
              "docs/quickstart.md",
              """    memory = SecureMemoryStore(\n        backend=raw_store,\n        vault=vault,\n    )\n\n    result = memory.write(\n""",
              """    memory = SecureMemoryStore(\n        backend=raw_store,\n        vault=vault,\n    )\n\n    # Advanced only:\n    # memory = SecureMemoryStore(\n    #     backend=raw_store,\n    #     vault=vault,\n    #     allow_raw_backend_access=True,\n    # )\n    # backend = memory.unsafe_backend(reason=\"one-time migration\", principal=\"admin\")\n\n    result = memory.write(\n""",
          )

          subprocess.run([sys.executable, "-m", "py_compile", "memgar/secure_memory_store.py", "memgar/integrations/universal.py"], check=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "memgar/secure_memory_store.py", "memgar/integrations/universal.py", "tests/test_secure_memory_store.py", "tests/test_universal_agent_memory_adapter.py", "README.md", "docs/quickstart.md"], check=True)
          subprocess.run(["git", "commit", "-m", "feat: add audited raw backend escape hatch"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          PY
