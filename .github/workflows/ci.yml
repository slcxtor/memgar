name: CI

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [published]

jobs:
  core-tests:
    name: Core test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]" numpy scikit-learn

      - name: Dependency vulnerability scan (pip-audit)
        if: matrix.python-version == '3.11'
        run: |
          pip install pip-audit
          pip-audit --skip-editable || true

      - name: Run full test suite
        run: python -m pytest -q

  security-hardening:
    name: Security hardening suite (gateway, SSRF, vault)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install security test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph,gateway,feed]" numpy scikit-learn

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable \
            --ignore-vuln PYSEC-2024-277 \
            --ignore-vuln PYSEC-2025-189 --ignore-vuln PYSEC-2025-190 \
            --ignore-vuln PYSEC-2025-191 --ignore-vuln PYSEC-2025-192 \
            --ignore-vuln PYSEC-2025-193 --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2025-195 --ignore-vuln PYSEC-2025-196 \
            --ignore-vuln PYSEC-2025-197 --ignore-vuln PYSEC-2025-210 \
            --ignore-vuln PYSEC-2026-139 \
            --ignore-vuln PYSEC-2025-211 --ignore-vuln PYSEC-2025-212 \
            --ignore-vuln PYSEC-2025-213 --ignore-vuln PYSEC-2025-214 \
            --ignore-vuln PYSEC-2025-215 --ignore-vuln PYSEC-2025-216 \
            --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2025-218

      - name: Run security hardening tests
        run: |
          python -m pytest -q \
            tests/test_security_hardening.py \
            tests/test_security_deep.py \
            tests/test_gateway.py \
            tests/test_policy_engine.py \
            tests/test_memory_vault.py \
            tests/test_runtime.py \
            tests/test_canary_and_tool_guard.py

  feature-tests:
    name: Feature tests (adversarial, feed, observability)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install with feature extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,feed,observability]" numpy scikit-learn

      - name: Run feature tests
        run: |
          python -m pytest -q \
            tests/test_adversarial.py \
            tests/test_feed.py \
            tests/test_observability.py

      - name: Smoke-test feed CLI commands
        run: |
          memgar feed status || true
          memgar feed verify || true

  red-team-ci:
    name: Adversarial red-team (offline, CI gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]" numpy scikit-learn

      - name: Generate adversarial variants (offline dry-run)
        run: |
          python scripts/red_team_run.py \
            --n-seeds 10 \
            --n-variants 5 \
            --dry-run \
            --offline \
            | tee red_team_report.json

      - name: Upload red-team report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-team-report-${{ github.sha }}
          path: red_team_report.json

  fpfn-calibration-gate:
    name: FP/FN calibration gate (multilingual)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml,semantic]" numpy scikit-learn

      - name: Run FP/FN calibration (gold corpus)
        run: |
          python scripts/calibrate_fpfn.py \
            --corpus ml/data/calibration_corpus.json \
            --output ml/artifacts/fpfn_calibration.json \
            --no-llm

      - name: Assert gold-corpus minimum quality gates
        run: python scripts/check_calibration_gate.py

      - name: Run expanded calibration (gold + mined + memory-context)
        run: |
          python scripts/calibrate_fpfn.py \
            --corpus ml/data/calibration_corpus.json \
            --corpus ml/data/mined_hard_subset.json \
            --corpus ml/data/augmented_memory_context.json \
            --output ml/artifacts/fpfn_calibration_expanded.json \
            --no-llm

      - name: Assert expanded-corpus regression gates
        run: python scripts/check_expanded_gate.py

      - name: Upload calibration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpfn-calibration-${{ github.sha }}
          path: |
            ml/artifacts/fpfn_calibration.json
            ml/artifacts/fpfn_calibration_expanded.json
