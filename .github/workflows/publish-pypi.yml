name: Publish Python package to PyPI

# Triggers:
#   - `release: published` — the standard path; GitHub Release created via UI
#     or `gh release create v1.x.y` fires this exactly once per tag.
#   - `workflow_dispatch` — manual re-run after a transient PyPI outage.
#
# Re-runs on a release that's already on PyPI used to hard-fail with
# `400 File already exists`. We now use `skip-existing: true` so accidental
# re-runs no-op cleanly. A real failure (e.g. PyPI 5xx, signature error)
# still surfaces.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Show built artefacts
        run: ls -la dist/
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/memgar/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
