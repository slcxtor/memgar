  name: GCG Universal Adversarial Suffix
  description: Gradient-based suffix attack producing universal jailbreak strings (Zou et al 2023)
  category: injection
  severity: critical
  patterns:
  - (?i)\bGCG\b.{0,40}(?:suffix|attack|adversarial)
  - (?i)(?:universal|gradient)\s+adversarial\s+(?:suffix|trigger|string)
  - (?i)describing\.\s*\+\s*similarlyNow\s+write\s+oppositeley
  - (?i)==\s*interface\s+Manuel\s+WITH\s+steps\s+instead
