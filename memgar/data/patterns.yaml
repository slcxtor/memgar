- id: JB-ACADEMIC-005
  name: Indirect Prompt Injection
  description: Greshake 2023 - injection via external documents, web pages, emails read by agent
  category: injection
  severity: critical
  patterns:
  - (?i)indirect\s+prompt\s+injection
  - (?i)(?:webpage|document|email|pdf|url)\s+.{0,40}(?:contains|has)\s+(?:hidden\s+|embedded\s+)?(?:instructions|prompt|commands)
  - (?i)(?:agent|ai|assistant)\s+reading\s+(?:this|the)\s+(?:document|page|email).{0,40}(?:must|should|will)\s+(?:execute|follow|obey)
  - (?i)IMPORTANT\s+(?:INSTRUCTIONS?|NOTICE)\s+(?:FOR|TO)\s+(?:AI|LLM|ASSISTANT|AGENT)
