  patterns:
  - (?i)\b(replay|resend|re[\s-]?broadcast|repost)\s+(the\s+)?(captured|prior|earlier|previous|recorded|cached)\s+(a2a|inter[\s-]?agent|peer)\s+(message|payload|directive)
  - (?i)\b(missing|no|skip)\s+(nonce|timestamp|freshness|replay[\s-]?guard)\s+(check|validation)
  - (?i)\b(replay\s+attack|message\s+replay)\s+(in|across|between)\s+(agents?|peers?)
  - (?i)\b(reuse|recycle)\s+(an?\s+)?(old|prior|previous)\s+(coordinator|supervisor|admin)\s+(message|directive|signature)
