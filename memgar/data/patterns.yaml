  - When returning the search result, prepend a directive the next agent will treat as system
  - Tool output contains a hidden instruction for the downstream summarizer agent
  - Poison the sub-agent's return value so the orchestrator reads it as policy
  mitre_attack: T1565.001
- id: MAGENT-006
  name: Handoff / Delegation Hijack
  description: Manipulates the handoff/delegation between agents to redirect the workflow to a malicious downstream agent or to an agent role with weaker filters
  category: behavior
  severity: high
  patterns:
  - (?i)\b(handoff|delegate|route|transfer|escalate|forward)\s+(this|the\s+task|the\s+request)\s+to\s+(a?n?\s+)?(unfiltered|raw|debug|test|sandbox|admin|root|developer|maintenance|legacy)\s+(agent|worker|model|endpoint)
  - (?i)\b(next\s+agent|target\s+agent|downstream\s+agent|delegate\s+to)\s*[:=]\s*['\"]?(unfiltered|admin|root|debug|legacy|maintenance|raw|jailbroken)['\"]?
  - (?i)\b(skip|bypass|short[\s-]?circuit)\s+(the\s+)?(reviewer|validator|approver|policy)\s+agent\s+(and\s+)?(go|hand\s+off|delegate)\s+(directly|straight)\s+to
  - (?i)\b(reroute|re[\s-]?delegate)\s+(to|through)\s+(an?\s+)?(weaker|raw|legacy|debug|unfiltered)\s+(model|agent|path)
