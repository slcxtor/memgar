- id: AWS-CRED-001
  name: AWS Access Key Exfiltration
  description: Direct AWS access key ID + secret exfiltration. AKIA/ASIA prefixes are unique to AWS and high-confidence indicators of credential leakage.
  category: credential
  severity: critical
  patterns:
  - \bAKIA[0-9A-Z]{16}\b
  - \bASIA[0-9A-Z]{16}\b
  - \bAGPA[0-9A-Z]{16}\b
  - \bAROA[0-9A-Z]{16}\b
  - \bAIDA[0-9A-Z]{16}\b
  - \bANPA[0-9A-Z]{16}\b
  - (?i)aws[\s_\-]?secret[\s_\-]?access[\s_\-]?key\s*[=:]\s*['\"]?[A-Za-z0-9/+=]{40}['\"]?
  - (?i)aws[\s_\-]?session[\s_\-]?token\s*[=:]\s*['\"]?[A-Za-z0-9/+=]{100,}['\"]?
  keywords:
  - AWS access key
  - AWS secret access key
  - AWS session token
  examples:
  - export AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
  - AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  mitre_attack: T1552.001
- id: AWS-CRED-002
  name: AWS Credentials File Read
  description: Attempts to read ~/.aws/credentials or ~/.aws/config, the canonical credential storage location
  category: credential
  severity: critical
  patterns:
  - (?i)cat\s+~?/?\.aws/credentials
  - (?i)cat\s+~?/?\.aws/config
  - (?i)(?:read|open|load|fetch)\s+(?:the\s+)?(?:file\s+)?~?/?\.aws/(?:credentials|config)
  - (?i)/root/\.aws/credentials
  - (?i)/home/\w+/\.aws/credentials
  - (?i)\$HOME/\.aws/credentials
  - (?i)AWS_SHARED_CREDENTIALS_FILE
  - (?i)AWS_CONFIG_FILE
  keywords:
  - .aws/credentials
  - AWS shared credentials file
  examples:
  - cat ~/.aws/credentials
  - Read the file at /root/.aws/credentials
  mitre_attack: T1552.001
- id: AWS-CRED-003
