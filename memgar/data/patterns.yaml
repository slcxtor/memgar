- id: JB-MULTI-004
  name: Sunk Cost Pressure
  description: Pressuring model by invoking prior effort already spent
  category: social
  severity: medium
  patterns:
  - (?i)(?:we'?ve|i'?ve|you'?ve)\s+(?:already|come\s+this\s+far|spent\s+so\s+much\s+time)
  - (?i)after\s+all\s+(?:that|this)\s+(?:work|effort|time)
  - (?i)don'?t\s+(?:give\s+up|stop)\s+now
