  - (?i)\b(from\s+now\s+on|now|today|starting\s+now)\s+(.{0,20}\s+)?(ignor[ea]|forget|disregard|skip|bypass|cancel)\s+(your|the|all|any)\s+(previous|prior|original|initial|preceding|earlier)
  - (?i)\bignor(e|en)\s+(the\s+)?(direction|instruction|rule|guideline)s?
