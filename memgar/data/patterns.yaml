  mitre_attack: T1611
- id: WEB3-CONTRACT-002
  name: selfdestruct / SELFDESTRUCT Abuse
  description: selfdestruct destroys contract and forwards ETH — used in rugs and to brick proxy implementations (Parity multisig 2017)
  category: execution
  severity: critical
  patterns:
  - (?i)\bselfdestruct\s*\(
  - (?i)\bsuicide\s*\(
  - (?i)assembly\s*\{[^}]{0,100}\bselfdestruct\b
  keywords:
  - selfdestruct
  examples:
  - selfdestruct(payable(attacker))
  mitre_attack: T1485
- id: WEB3-CONTRACT-003
  name: tx.origin Authentication
  description: Using tx.origin for auth allows phishing contracts to impersonate users — SWC-115
  category: privilege
  severity: critical
  patterns:
  - (?i)tx\.origin\s*==\s*
  - (?i)require\s*\(\s*tx\.origin
  - (?i)if\s*\(\s*tx\.origin\s*
  keywords:
  - tx.origin auth
  - SWC-115
  examples:
  - require(tx.origin == owner)
  mitre_attack: T1078
- id: WEB3-CONTRACT-004
  name: Reentrancy Vulnerability Pattern
  description: External call before state update — classic DAO/Cream/Fei pattern (SWC-107)
  category: execution
  severity: critical
  patterns:
  - (?i)\.call\s*\{\s*value\s*:[^}]*\}\s*\(\s*[\"']{2}\s*\)[^;]*;[\s\n]*(?:balances|userBalance|deposits)\s*\[
  - (?i)transfer\s*\(\s*msg\.sender.{0,80}\)\s*;[\s\n]*balances\s*\[
  - (?i)reentran(?:t|cy).{0,40}(?:vulnerab|attack)
  - (?i)nonReentrant.{0,40}(?:missing|removed|disabled)
  keywords:
  - reentrancy
  - SWC-107
  examples:
  - 'msg.sender.call{value: amt}(''''); balances[msg.sender] = 0;'
  mitre_attack: T1190
- id: WEB3-CONTRACT-005
  name: Unchecked External Call Return
  description: Low-level .call() return value not checked — silent failures (SWC-104)
  category: execution
  severity: high
  patterns:
  - (?im)^(?!.*(?:success\s*=|bool\s+\w+\s*=).*\.call).*?\b\w+\.call\s*\{[^}]*\}\s*\(\s*[\"']
  - (?im)^(?!.*(?:success\s*=|bool\s+\w+\s*=).*\.call).*?\b\w+\.call\s*\(\s*abi\.encode
  keywords:
  - unchecked call
  - SWC-104
  examples:
  - 'target.call{value: 1 ether}('''');'
  mitre_attack: T1499
- id: WEB3-CONTRACT-006
  name: Integer Overflow / Underflow (Pre-0.8)
  description: Solidity <0.8.0 lacks default overflow checks — SWC-101
  category: execution
  severity: high
  patterns:
  - (?i)pragma\s+solidity\s+\^?0\.[0-7]\.\d+
  - (?i)unchecked\s*\{
  - (?i)SafeMath\s*\.(?:add|sub|mul|div)
  keywords:
  - overflow
  - underflow
  - SWC-101
  - unchecked block
  examples:
  - pragma solidity ^0.7.0; balance -= amount;
  mitre_attack: T1499
- id: WEB3-CONTRACT-007
  name: Hidden Mint / Owner Backdoor
  description: Owner-only mint functions or unrestricted minting in token contracts — common rugpull vector
  category: privilege
