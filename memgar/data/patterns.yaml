  patterns:
  - (?i)(?:design|create|write|generate)\s+(?:a\s+)?(?:jailbreak|prompt\s+injection|attack\s+prompt)
  - (?i)how\s+(?:would|could)\s+(?:someone|an\s+attacker)\s+jailbreak
  - (?i)(?:create|write)\s+(?:a\s+)?(?:DAN|jailbreak|evil)\s+prompt
