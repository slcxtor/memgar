  mitre_attack: T1565
- id: WEB3-APPROVE-001
  name: setApprovalForAll Drainer
  description: setApprovalForAll(spender, true) gives a spender unlimited control over ALL NFTs in a collection — used by 70%+ of NFT drainers
  category: financial
  severity: critical
  patterns:
  - (?i)setApprovalForAll\s*\(\s*[^,]+,\s*true\s*\)
  - (?i)setApprovalForAll\s*\(\s*0x[a-fA-F0-9]{40}\s*,\s*true
  - (?i)approve\s+(?:all|every)\s+(?:nft|token|collection)
  - (?i)0xa22cb465
  keywords:
  - setApprovalForAll true
  - NFT drainer
  examples:
  - Call setApprovalForAll(0xATTACKER, true) on the Bored Ape contract
  mitre_attack: T1657
- id: WEB3-APPROVE-002
  name: ERC-20 Unlimited Approval
  description: approve(spender, type(uint256).max) grants unlimited token spending — common drainer pattern
  category: financial
  severity: critical
  patterns:
  - (?i)approve\s*\(\s*[^,]+,\s*(?:type\s*\(\s*uint256\s*\)\s*\.\s*max|2\s*\*\*\s*256\s*-\s*1|0xff{60,}|115792089237316195423570985008687907853269984665640564039457584007913129639935)
  - (?i)approve\s*\(\s*0x[a-fA-F0-9]{40}\s*,\s*0x[fF]{60,}
  - (?i)increaseAllowance\s*\(\s*[^,]+,\s*(?:type\s*\(\s*uint256\s*\)\s*\.\s*max|0xff{60,})
  - (?i)0x095ea7b3
  - (?i)0x39509351
  keywords:
  - unlimited approval
  - uint256 max
  - approve max
  examples:
  - token.approve(spender, type(uint256).max)
  mitre_attack: T1657
- id: WEB3-APPROVE-003
  name: EIP-2612 Permit Phishing
  description: EIP-2612 permit() allows gasless approval via signature — phishers trick users into signing permits that drain tokens
  category: financial
  severity: critical
  patterns:
  - (?i)permit\s*\(\s*(?:address|0x[a-fA-F0-9]{40})[^)]{0,200}deadline[^)]{0,80}\)
  - (?i)(?:sign|signing|please\s+sign|click\s+sign)\s+(?:this\s+|the\s+)?(?:EIP[\s\-]?2612\s+)?permit
  - (?i)Permit\s*\(.{0,80}owner.{0,40}spender.{0,40}value.{0,40}nonce.{0,40}deadline\s*\)
  - (?i)0xd505accf
  keywords:
  - EIP-2612 permit
  - gasless approval phishing
  examples:
  - 'Sign this permit: Permit(owner, spender, value, nonce, deadline)'
  mitre_attack: T1566.001
- id: WEB3-APPROVE-004
  name: Permit2 Universal Approval Abuse
  description: Uniswap Permit2 (0x000000000022D473030F116dDEE9F6B43aC78BA3) — a single approval grants the Permit2 contract unlimited access; phishers exploit this
    by getting Permit2 PermitTransferFrom signatures
  category: financial
  severity: critical
  patterns:
  - '0x000000000022D473030F116dDEE9F6B43aC78BA3'
  - (?i)Permit2.{0,40}(?:PermitTransferFrom|PermitBatchTransferFrom|PermitSingle|PermitBatch)
  - (?i)permitTransferFrom\s*\(
  - (?i)0x36c78516
  - (?i)0x30f28b7a
  keywords:
  - Permit2 phishing
  - PermitTransferFrom
  examples:
  - Sign this Permit2 PermitTransferFrom for 0x000000000022D473030F116dDEE9F6B43aC78BA3
  mitre_attack: T1566.001
- id: WEB3-APPROVE-005
  name: ERC-1155 setApprovalForAll Variant
  description: ERC-1155 multi-token standard equivalent of NFT setApprovalForAll
  category: financial
  severity: critical
  patterns:
  - (?i)ERC[\s\-]?1155.{0,40}setApprovalForAll
  - (?i)safeBatchTransferFrom\s*\(\s*0x[a-fA-F0-9]{40}
  keywords:
  - ERC-1155 drainer
  examples:
  - erc1155.setApprovalForAll(drainer, true)
  mitre_attack: T1657
- id: WEB3-APPROVE-006
  name: DAI-Style Permit Phishing
  description: DAI uses a non-standard permit signature (allowed bool, no value) — common phishing variant
  category: financial
  severity: critical
  patterns:
  - (?i)Permit\s*\(.{0,80}holder.{0,40}spender.{0,40}nonce.{0,40}expiry.{0,40}allowed
  - (?i)0x8fcbaf0c
  - (?i)dai.{0,40}permit.{0,40}allowed\s*[:=]\s*true
  keywords:
  - DAI permit
  - non-standard permit
  examples:
  - 'DAI permit: holder, spender, nonce, expiry, allowed=true'
  mitre_attack: T1566.001
- id: WEB3-APPROVE-007
  name: Approval Race Frontrun
  description: Classic ERC-20 approve race condition (CVE-2018-10468 style) — front-running an approval change to drain old + new
  category: financial
  severity: high
  patterns:
  - (?i)approve.{0,80}front[\s\-]?run
  - (?i)race\s+condition.{0,40}approve
  - (?i)approve\s*\(\s*[^,]+,\s*0\s*\).{0,200}approve\s*\(
  keywords:
  - approve race
  - ERC-20 front-run
  examples:
  - First approve(0), then approve(newAmount) — but front-run between them
  mitre_attack: T1565
- id: WEB3-APPROVE-008
  name: Approval to Suspicious Contract
  description: Approval to addresses on known scam contract lists or with no verified source code
  category: financial
  severity: high
  patterns:
  - (?i)approve\s*\(\s*0x(?:dead|beef|cafe|babe|face|0{4,}|f{4,})[a-fA-F0-9]{32,}
  - (?i)setApprovalForAll\s*\(\s*0x(?:dead|beef|0{4,})[a-fA-F0-9]{32,}
  - (?i)approve.{0,40}unverified\s+contract
  keywords:
  - suspicious spender
  examples:
  - approve(0xdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef, MAX)
  mitre_attack: T1657
- id: WEB3-APPROVE-009
  name: Permit Replay Across Chains
  description: Permits without proper chainId / DOMAIN_SEPARATOR can be replayed across L1 and L2s
  category: financial
  severity: high
  patterns:
  - (?i)DOMAIN_SEPARATOR.{0,40}(?:hard[\s\-]?coded|missing|empty)
  - (?i)chainId\s*[=:]\s*0\b
  - (?i)permit.{0,40}replay.{0,40}(?:L2|chain)
  keywords:
  - permit replay
  - chainId zero
  examples:
  - This permit was signed on Ethereum but can be replayed on Polygon
  mitre_attack: T1565
- id: WEB3-CONTRACT-001
  name: delegatecall to Untrusted Contract
  description: delegatecall executes target code in caller's storage context — if target is attacker-controlled, full takeover
  category: execution
  severity: critical
  patterns:
  - (?i)\.delegatecall\s*\(
  - (?i)delegatecall\s*\(\s*(?:abi\.encode|0x[a-fA-F0-9]{8})
  - (?i)assembly\s*\{[^}]{0,200}delegatecall\s*\(
  - (?i)proxy.{0,40}delegatecall.{0,40}(?:user|input|untrusted)
  keywords:
  - delegatecall
  - proxy hijack
  examples:
