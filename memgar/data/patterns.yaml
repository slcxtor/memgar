  - (?i)\b(every|all)\s+(peer|agent|sibling)\s+(votes?\s+|rates?\s+|trusts?\s+)\s+(me|this\s+agent|the\s+attacker)\s+(highest|first|top)
  - (?i)\b(sybil|collusion|reputation\s+farm|trust\s+farm)\s+(in|against|on)\s+(the\s+)?(mesh|swarm|crew|agent\s+system)
