  - (?i)\b(add|register)\s+(a\s+new\s+|an?\s+)?(agent|peer|worker)\s+with\s+role\s*[:=]\s*['\"]?(admin|root|supervisor|coordinator|orchestrator)['\"]?
  - (?i)\b(role\s+mapping|capability\s+declaration|permission\s+list)\s+(tamper|edit|forge|inject|elevate)
