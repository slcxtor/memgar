  - (?i)\b(şimdi\s+)?(sen\s+)?(artık\s+)?(.{1,30})\s+rolündesin,?\s+(kısıtlama|kural|filtre)\s+(yok|kabul\s+etme|olmadan)
  - (?i)\b(geliştirici\s+modu|developer\s+modu|dan\s+modu)\s+(aktif|açık|etkinleştir)
