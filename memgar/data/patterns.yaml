  - (?i)\b(her\s+şeyi|tümünü|hepsini)\s+(unut|sil|yok\s+say)
  keywords:
  - ignore all previous
  - ignore the directions
  - forget all restriction
  - disregard all previous
  - ignore previous text
  - forget everything above
  - ignoren the directions
  - ignore your previous
  - skip all previous
  - önceki talimatları yok say
  - her şeyi unut
