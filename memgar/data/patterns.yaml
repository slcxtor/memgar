  - (?i)169\.254\.169\.254/latest/(?:meta-data|user-data|dynamic)
  - (?i)latest/meta-data/iam/security-credentials
  - (?i)curl\s+(?:-s\s+)?(?:http://)?169\.254\.169\.254
  - (?i)wget\s+.{0,40}169\.254\.169\.254
  - (?i)fetch\s*\(\s*['\"]https?://169\.254\.169\.254
