  - import { drain } from './inferno-drainer.js'
  mitre_attack: T1059.007
- id: WEB3-WALLET-008
  name: Address Poisoning Attack
  description: Sending dust transactions from lookalike addresses to poison transaction history
  category: manipulation
  severity: high
  patterns:
  - (?i)address\s+poison(?:ing)?
  - (?i)(?:dust|micro)\s+(?:transaction|attack).{0,40}(?:lookalike|similar\s+address)
  - (?i)0x[a-fA-F0-9]{4}\.{3}[a-fA-F0-9]{4}
  keywords:
  - address poisoning
  - dust attack
  examples:
