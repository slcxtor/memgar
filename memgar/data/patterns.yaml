  category: credential
  severity: critical
  patterns:
  - (?i)X-aws-ec2-metadata-token(?:-ttl-seconds)?
  - (?i)PUT\s+.{0,80}169\.254\.169\.254/latest/api/token
  - (?i)curl\s+-X\s+PUT\s+.{0,80}metadata-token
  - (?i)IMDSv2.{0,40}token
