  - (?i)\b(what\s+(are|were|is)\s+your\s+)?(initial|original|first|system|hidden|secret)\s+(instruction|prompt|directive)s?\b
  - (?i)\b(how\s+do\s+I\s+|how\s+to\s+|can\s+I\s+|how\s+can\s+I\s+)?(change|modify|alter|update|edit|rewrite|replace)\s+(the\s+|your\s+|its\s+)?(instruction|prompt|rule|directive|guideline)s?\s+(given\s+to\s+you|for\s+you)?
