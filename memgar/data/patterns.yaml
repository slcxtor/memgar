  - (?i)(as\s+of|starting|effective)\s+.{0,20}(2[0-9]{3}|yesterday|today|now)\s+.{0,30}(no\s+longer|all\s+restrictions|fully\s+allowed)
  - (?i)(new|updated)\s+(policy|directive|rule|guideline).{0,40}(all\s+restrictions?\s+(are\s+)?(now\s+)?(lifted|removed|waived|gone))
  - (?i)(admin|management|ceo|security\s+team)\s+(confirmed|approved|authorized|announced)\s+.{0,40}(no\s+(more\s+)?restrictions?|fully\s+open|all\s+allowed)
  - (?i)(güvenlik\s+politikası|kural|kısıtlama).{0,40}(kaldırıldı|güncellendi|artık\s+yok|geçersiz)
  - (?i)(yönetici|yönetim|admin).{0,30}(onayladı|doğruladı|kaldırdı).{0,40}(kısıtlama|engel|kural)
