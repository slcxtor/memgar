  - (?i)(?:always|only)\s+(?:trust|cite|use|reference|rely\s+on)\s+(?:this|the\s+following)\s+(?:source|document|content)
  - (?i)(?:disregard|ignore|do\s+not\s+(?:trust|use|cite))\s+(?:other|conflicting|alternative|competing)\s+(?:sources?|documents?|results?|information)
  - (?i)(?:supersedes?|overrides?|replaces?)\s+(?:all\s+)?(?:other|previous|prior)\s+(?:sources?|information|documents?)
