  - (?i)\b(side[\s-]?channel|covert[\s-]?channel|out[\s-]?of[\s-]?band)\s+(message|directive|payload)\s+(to|for|between)\s+agents?
  - (?i)\b(stash|hide|embed)\s+(an?\s+)?(instruction|directive|payload)\s+in\s+(the\s+)?(log|trace|metric|status|error)\s+for\s+(another|sibling|peer)\s+agent
  - (?i)\b(shared\s+file|tmp\s+file|disk\s+drop)\s+(as\s+)?(side[\s-]?channel|covert)\s+(between|for)\s+agents
