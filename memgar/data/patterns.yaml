  - (?i)base64\s*(encode|decode)?.{0,40}(send|post|forward|transmit|append)
  - (?i)(tracking\s+pixel|1x1\s+pixel|pixel\.gif)\s+.{0,30}(user|session|token|id)
  - (?i)(oturum|token|çerez|kimlik)\s+(belirtecini?|anahtarını?)\s+(base64|kodla|şifrele).{0,40}(ekle|gönder|ilet)
