[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memgar"
version = "1.2.0"
description = "AI Agent Memory Security — Detect and prevent memory poisoning, DoW attacks, and forensic analysis for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Selcuk", email = "hello@memgar.com" }
]
keywords = [
    "ai-security", "llm-security", "agent-security", "memory-poisoning",
    "prompt-injection", "denial-of-wallet", "dow", "forensics",
    "langchain", "llamaindex", "crewai", "autogen", "mcp",
    "rag-security", "owasp", "asi06", "memory-guard",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "networkx>=3.0",
    "prometheus_client>=0.17.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.3.0",
    "build>=1.0.0",
]
graph = [
    "networkx>=3.0",
]
semantic = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.21.0",
]
ml = [
    "transformers>=4.40.0",
    "onnxruntime>=1.17.0",
    "datasets>=2.18.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.3.0",
]
ml-train = [
    "memgar[ml]",
    "torch>=2.0.0",
    "optimum[onnxruntime]>=1.17.0",
    "peft>=0.10.0",
]
llm = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
]
langchain = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
]
llamaindex = [
    "llama-index-core>=0.10.0",
]
crewai = [
    "crewai>=0.1.0",
]
autogen = [
    "pyautogen>=0.2.0",
]
watch = [
    "watchdog>=3.0.0",
]
agents = [
    "memgar[langchain,crewai,autogen]",
]
rag = [
    "memgar[langchain,llamaindex]",
]
adversarial = [
    "anthropic>=0.18.0",
]
feed = [
    "cryptography>=41.0.0",
]
observability = [
    "prometheus_client>=0.17.0",
]
compliance = [
    # Standalone EU AI Act / regulatory reporter — no extra runtime deps
    # beyond the core, listed as an extra so it's a single-pip install for
    # European deployments that need the Reg 2024/1689 Annex IV report.
]
tracing = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]
gateway = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.25.0",
    # Production gateway deployments expect full multi-layer protection.
    # Bundle semantic + feed by default so `memgar[gateway]` is genuinely
    # production-ready out of the box (Layer 1 + Layer 1.5 + signed feed).
    "memgar[semantic,feed]",
]
production = [
    # Curated bundle for "I'm deploying memgar in front of an agent".
    # All four detection layers active (Layer 1 pattern + 1.5 semantic +
    # 3 trust + 4 behavioral), feed verification, observability metrics.
    "memgar[semantic,feed,observability,gateway]",
]
all = [
    "memgar[dev,semantic,ml,llm,langchain,llamaindex,crewai,autogen,watch,adversarial,feed,observability,tracing,server,graph,gateway]",
]

[project.scripts]
memgar = "memgar.cli:main"

[project.urls]
Homepage = "https://memgar.com"
Documentation = "https://docs.memgar.com"
Repository = "https://github.com/slcxtor/memgar"
Issues = "https://github.com/slcxtor/memgar/issues"
Changelog = "https://github.com/slcxtor/memgar/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["memgar"]

[tool.hatch.build.targets.sdist]
include = [
    "/memgar",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes (F), import-sort (I), whitespace (W), bugbear (B), quotes (Q) and the
# pycodestyle error core (E) are enforced. pep8-naming (N) is intentionally NOT
# enforced: the codebase uses domain exception names without an `Error` suffix
# (PoisoningRefused, RateLimited, MemoryWriteBlocked …) and single-letter matrix
# / scoring variables (S1…S7) by design; renaming the public exceptions would be
# a breaking API change for callers that catch them.
select = ["E", "F", "I", "W", "B", "Q"]
ignore = [
    "E501",  # line length — long pattern strings / URLs are unavoidable here
    "E402",  # module import not at top — used for sys.path setup + optional-dep guards
    "E701",  # multiple statements on one line (colon) — terse guard clauses kept on purpose
    "E702",  # multiple statements on one line (semicolon) — same
    "E741",  # ambiguous variable name — short names are fine in tight local scopes
    "B904",  # raise-without-from — exception chaining is nice-to-have, not enforced
    "B007",  # unused loop control variable — not worth churning to `_`
]

[tool.ruff.lint.per-file-ignores]
# Re-export modules: F401 is intent (public API surface), documented by __all__
"memgar/__init__.py" = ["F401"]
"memgar/integrations/__init__.py" = ["F401"]
"memgar/agents/__init__.py" = ["F401"]
"memgar/core/__init__.py" = ["F401"]
"memgar/feed/__init__.py" = ["F401"]
"memgar/frameworks/__init__.py" = ["F401"]
"memgar/multimodal/__init__.py" = ["F401"]
"memgar/observability/__init__.py" = ["F401"]
# Availability-probe modules: a bare `import optional_dep` is the documented way
# these detect whether an optional backend is installed; F401 is the intent.
"memgar/embeddings.py" = ["F401"]
"memgar/cli.py" = ["F401"]
"memgar/frameworks/langchain_deep.py" = ["F401"]
"memgar/frameworks/llamaindex_deep.py" = ["F401"]
"memgar/integrations/mcp_server.py" = ["F401"]
"memgar/multimodal/pdf_analyzer.py" = ["F401"]
"memgar/observability/tracing.py" = ["F401"]
# Test files: unused imports often intentional (fixtures, parametrize markers)
"tests/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["memgar"]

[tool.bandit]
exclude_dirs = ["tests", "ml/data", "scripts/training_data"]
skips = [
    # B404 (subprocess import) — managed call-sites already validated
    "B404",
    # B603 (subprocess without shell=True) — equivalent to B404 above
    "B603",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -m 'not slow'"
asyncio_mode = "auto"
markers = [
    "slow: full throughput/load benchmarks (run with: pytest -m slow)",
    "asyncio: mark test as async/asyncio (auto-applied when asyncio_mode=auto)",
]

[tool.coverage.run]
source = ["memgar"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pip-audit]
# torch + transformers enter the env transitively via `sentence-transformers`
# (Layer 1.5 SemanticGuard encoder, pulled by `gateway` / `semantic` extras).
# All ignored CVEs concern pickle/serialization or remote-hub auto-loading —
# memgar uses these libraries only for forward-pass inference on local model
# files shipped with the package; never `torch.load()` on untrusted artifacts,
# never `AutoModel.from_pretrained("hub-id")` for arbitrary remote names.
# Re-evaluate each ignore on every release; remove once upstream patches ship.
ignore-vulns = [
    # joblib pickle RCE — scikit-learn parallel backend dep, no fix available.
    "PYSEC-2024-277",
    # torch 2.12.0 — 11 advisories, no upstream fix as of 2026-05-20.
    # All concern pickle/serialization in `torch.load()`; not used at runtime.
    "PYSEC-2025-189", "PYSEC-2025-190", "PYSEC-2025-191", "PYSEC-2025-192",
    "PYSEC-2025-193", "PYSEC-2025-194", "PYSEC-2025-195", "PYSEC-2025-196",
    "PYSEC-2025-197", "PYSEC-2025-210", "PYSEC-2026-139",
    # transformers 5.9.0 — 8 advisories, no upstream fix as of 2026-05-20.
    # Concern tokenizer/auto-class loading from remote hubs; we use only
    # locally-saved tokenizers shipped alongside the trained ONNX model.
    "PYSEC-2025-211", "PYSEC-2025-212", "PYSEC-2025-213", "PYSEC-2025-214",
    "PYSEC-2025-215", "PYSEC-2025-216", "PYSEC-2025-217", "PYSEC-2025-218",
]
